# REFERENCE ONLY — the live file is GENERATED by dns-failover.service.
#
# This is what /etc/dnsmasq.d/pihole.conf contains in the PRIMARY state. Do not
# edit the live file by hand: dns-failover.sh reconciles it on every run and
# will overwrite the change (and log that it drifted).
#
# Why the node's dnsmasq matters: the cluster is single-stack IPv4, so Pi-hole
# has no IPv6 and k3s klipper holds the IPv4 hostPort 53 — queries to
# 192.168.1.42:53 are DNAT'd straight to the Pi-hole pod and never reach
# dnsmasq. The Freebox advertises this node's IPv6 as the LAN's custom DNS, so
# dnsmasq serves the [::]:53 path, and THAT is the path every device in the
# house actually uses. Test failover over the node's IPv6, never over IPv4:
# the IPv4 path dies with the pod and will make a working fallback look broken.
#
# Install (node):
#   sudo install -m 0755 dns-failover.sh /usr/local/sbin/dns-failover.sh
#   sudo install -m 0644 dns-failover.service dns-failover.timer /etc/systemd/system/
#   sudo systemctl daemon-reload && sudo systemctl enable --now dns-failover.timer
#
# Verify (NODE6 = the node's global IPv6):
#   nslookup aladhan.home    $NODE6   # -> 192.168.1.42
#   nslookup doubleclick.net $NODE6   # -> 0.0.0.0 (blocked)
#
# NOTE: never leave a backup (e.g. pihole.conf.bak) in /etc/dnsmasq.d/ — dnsmasq
# loads EVERY file there, so a stale backup re-adds upstreams and breaks .home.

no-resolv
interface=eth0
server=192.168.1.44
