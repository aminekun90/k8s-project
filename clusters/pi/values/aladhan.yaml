# Values for the Pi's `adhan` release, read by clusters/pi/argocd/apps/adhan.yaml.
#
# `image.tag` is written by aladhan_api's publish.yml after every build of main —
# one commit per deployment, so `git log` of this file is the deployment history
# and `git revert` is a rollback. Tag *and* digest: the tag says which commit, the
# digest makes the reference immutable.
image:
  tag: sha-5d7a58616ecfc7a073690c8b02d827e9cb98ddf3@sha256:37518366efbec403c31fd00a7657fb04b90f9d6c9a7e248bd48d8b60cfc8a605

env:
  # The chart closes the attestation gate by default; this node opens it, on
  # purpose and in writing. The environment is the ceiling: with it open, an
  # administrator can close the gate from the portal once a device has proven
  # the exchange — and reopen it — without a deploy. Closed here, the portal
  # could never open it again.
  ATTEST_ENFORCED: "false"

# HTTPS on the LAN for the iOS Release build, which refuses plain HTTP and any
# host it has not allowlisted. LAN-only: the name resolves to the Pi's private IP.
ingress:
  secureHost: qibla-api.duckdns.org
  certResolver: duckdns

# PostgreSQL beside the API, since 2026-10. The Secret `qibla-db` is created by
# hand (see the chart's values.yaml); the SQLite file stays where it was, as a
# record, and is imported once by the first migration job that can.
database:
  enabled: true
  legacySqlitePath: /app/src/data/cities.db

# The session and TOTP keys, out of the database — copied from where the app had
# stored them, never regenerated (a new TOTP key loses every second factor).
# Created by hand: AUTH_SECRET, TOTP_ENCRYPTION_KEY.
envSecret: adhan-api-env
