# Pins traefik's LoadBalancer address the same way pihole-dns pins its own, and
# gives the LAN a real HTTPS certificate.
#
# k3s ships traefik as a bundled HelmChart and RE-APPLIES it on every k3s
# restart. That re-apply recreated the Service, MetalLB re-reconciled both
# LoadBalancers against a shared auto-assigning pool, and pihole-dns lost its
# .44 announcement for the duration — the LAN-wide DNS drop. Pinning both ends
# removes the contention instead of racing it.
#
# HelmChartConfig (not HelmChart) so k3s merges these values into its own chart
# definition; editing the bundled HelmChart directly is overwritten on restart.
# Not managed by Argo CD — apply it by hand:
#
#   kubectl apply -f clusters/pi/traefik-helmchartconfig.yaml
#
# --- HTTPS on the LAN, without exposing anything -------------------------------
# The iOS App Store build only talks to an https host it allowlists; `.home` can
# never get a certificate an iPhone trusts. A free DuckDNS name can: Let's
# Encrypt validates it by a DNS TXT record (DNS-01), so nothing on the internet
# ever connects to the Pi and no port is opened on the router.
#
# Public DNS points the name at the Pi's private address, 192.168.1.42: LAN
# devices ask the Freebox's IPv6 resolver before Pi-hole, so a public 127.0.0.1
# made them miss the Pi. Elsewhere that address is a stranger's device, which
# cannot present this certificate — TLS fails before the request is sent.
#
# The token lives in a Secret created out of band, never in git:
#
#   kubectl -n kube-system create secret generic duckdns-token \
#     --from-literal=token='<DuckDNS token>'
#
# `optional: true` so a missing Secret costs the certificate, not traefik — the
# whole LAN ingress goes through this pod.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.io/loadBalancerIPs: "192.168.1.42"
        metallb.io/address-pool: "traefik-pool"
    env:
      - name: DUCKDNS_TOKEN
        valueFrom:
          secretKeyRef:
            name: duckdns-token
            key: token
            optional: true
    certificatesResolvers:
      duckdns:
        acme:
          storage: /data/acme.json
          dnsChallenge:
            provider: duckdns
            # Public resolvers, not the cluster's: Pi-hole overrides the name
            # with a LAN address and must not answer the propagation check.
            resolvers:
              - "1.1.1.1:53"
              - "9.9.9.9:53"
    # acme.json must survive a pod restart: re-issuing on every k3s restart
    # would hit Let's Encrypt's five-per-week duplicate limit within days.
    persistence:
      enabled: true
      size: 128Mi
      storageClass: local-path
