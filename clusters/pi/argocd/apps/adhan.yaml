apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adhan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aminekun90/k8s-project.git
    targetRevision: main
    path: charts/aladhan
    helm:
      # The chart closes the attestation gate by default; this node opens it,
      # on purpose and in writing. The environment is the ceiling: with it open,
      # an administrator can close the gate from the portal once a device has
      # proven the exchange — and reopen it — without a deploy. Closed here, the
      # portal could never open it again.
      valuesObject:
        env:
          ATTEST_ENFORCED: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: adhan
  # Auto-sync: the cluster follows git automatically, except the image.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without it, any other change to the Deployment would sync the chart's
      # `:latest` back over the digest the app pinned — ignoreDifferences only
      # hides the drift, it does not keep it.
      - RespectIgnoreDifferences=true
  # The app pins its own image by digest (About dialog → "Update", which calls
  # /update/force), and so does a deploy by `sha-` tag. That digest lives only in
  # the cluster: Argo must not flag it as drift, nor revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: adhan-api
      jsonPointers:
        - /spec/template/spec/containers/0/image
