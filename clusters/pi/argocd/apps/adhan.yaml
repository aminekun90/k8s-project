apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adhan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aminekun90/k8s-project.git
    targetRevision: main
    path: charts/aladhan
    helm:
      # Relative to `path`. Holds the pinned image and this node's overrides.
      valueFiles:
        - ../../clusters/pi/values/aladhan.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: adhan
  # Auto-sync: the cluster follows git, the image included. A deployment is a
  # commit to clusters/pi/values/aladhan.yaml, made by aladhan_api's publish.yml.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
