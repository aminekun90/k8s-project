# Values for the public `adhan` release on the OVH VPS, read by
# clusters/cloud/argocd/apps/adhan.yaml.
#
# The internet-facing backend: the iOS app's API, the mosque directory, the
# portal and the treasury. Not the Raspberry Pi, which keeps the Sonos player
# on the home LAN. Runbook: docs/cloud-ovh.md.

# Pinned like the Pi's, to the Pi's image of the day this file was written.
# publish.yml writes every build of main into clusters/pi only; add this file to
# that step at the cutover, so both nodes run the same commit.
image:
  tag: sha-9ae97cfffbd6540ec154330d666d10cc023a506f@sha256:a1a76d25e805321e3516496fe8be0d85cb9e44e3c6b99f35cb24fefaed88a861

# --- What this deployment is not ------------------------------------------
# No speakers here. The device routes drive hardware and take no
# authentication: on the LAN the router was the boundary, on the internet they
# would be an open remote control.
player:
  enabled: false

# All three exist only for the player. Without them the pod is unprivileged and
# gets a normal rolling update instead of Recreate.
hostNetwork: false
audio:
  enabled: false
bluetooth:
  enabled: false

nodeSelector: {}

# --- Exposure --------------------------------------------------------------
# Certified by traefik's own ACME resolver (clusters/cloud/traefik-helmchartconfig.yaml),
# so no cert-manager and no TLS Secret to manage.
ingress:
  enabled: true
  className: traefik
  # The real hostname, once the domain is bought. Left empty, `required` stops
  # the render: an Ingress for no host would answer every name pointed here.
  host: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  tls:
    enabled: false
    secretName: ""

# --- Data ------------------------------------------------------------------
# Postgres beside the API, as on the Pi. Filled at the cutover by a pg_dump of
# the Pi restored here (docs/cloud-ovh.md), never by the SQLite import: that
# file is the Pi's past, not this node's.
database:
  enabled: true
  legacySqlitePath: ""

# 4 GB of RAM and NVMe instead of a Pi's 1.7 GiB and an SD card.
postgres:
  storage: 20Gi
  settings:
    shared_buffers: 256MB
    effective_cache_size: 1GB
    work_mem: 8MB
    maintenance_work_mem: 128MB
    max_connections: "50"
    random_page_cost: "1.1"
    checkpoint_timeout: 15min
    max_wal_size: 1GB
    log_min_duration_statement: 500ms
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Nightly dumps on the VPS disk, which OVH's daily VPS backup carries off the
# machine; scripts/pull-postgres-backups.sh can pull them too. The directory
# must exist, owned by uid 1000 (docs/cloud-ovh.md).
backup:
  enabled: true
  hostPath: /var/lib/qibla/backups/postgres
  runAsUser: 1000

# Claim documents and anything the API writes to disk. One node, so a hostPath
# is honest here; it would not be with a second node.
dataPath: /var/lib/qibla/data

env:
  # Also selects the App Attest identity: production ⇒ the App Store App ID, and
  # development attestations refused.
  APP_ENV: production
  # Open in the environment, as on the Pi: the environment is the ceiling, and
  # with it open an administrator closes and reopens the gate from the portal
  # without a deploy. Closed here, the portal could never open it again.
  ATTEST_ENFORCED: "false"
  CLAIM_DOCUMENT_DIR: /app/var/claim-documents

# Created by hand on the node, never in git (docs/cloud-ovh.md):
#   AUTH_SECRET, TOTP_ENCRYPTION_KEY — copied from the Pi's `adhan-api-env`,
#   never regenerated: a new TOTP key loses every second factor, a new session
#   key signs everyone out.
envSecret: adhan-api-env

replicaCount: 1

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 768Mi
