name: Validate Helm charts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Lint charts
        run: |
          helm lint charts/aladhan
          helm lint charts/pihole --set adminPassword=ci-dummy
          helm lint charts/increaser

      - name: Render templates (must succeed)
        run: |
          helm template aladhan charts/aladhan -n adhan > /dev/null
          # The portable target: the cloud values must render too. ingress.host is
          # deliberately empty there (it is site-specific and `required` guards
          # it), so feed a dummy one rather than weakening the guard.
          helm template aladhan charts/aladhan -n adhan \
            -f clusters/cloud/values/aladhan.yaml \
            --set ingress.host=example.invalid > /dev/null
          helm template pihole charts/pihole -n pihole --set adminPassword=ci-dummy > /dev/null
          # Also exercise the optional Pi-hole DHCP path.
          helm template pihole charts/pihole -n pihole \
            --set adminPassword=ci-dummy --set dhcp.enabled=true > /dev/null
          helm template increaser charts/increaser -n increaser > /dev/null

      - name: Validate manifests against the Kubernetes schema
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          for chart in aladhan pihole increaser; do
            args=""
            [ "$chart" = "pihole" ] && args="--set adminPassword=ci-dummy"
            helm template "$chart" "charts/$chart" -n "$chart" $args \
              | /tmp/kubeconform -strict -ignore-missing-schemas -summary
          done
