replicaCount: 1

image:
  repository: aminekun90/adhan-api
  # Mutable tag so the cluster always runs the newest build. deploy.sh /
  # the app CI pushes both <version> and latest.
  tag: latest
  pullPolicy: Always

# OTA auto-update via Keel (https://keel.sh): Keel polls Docker Hub and
# redeploys this Deployment whenever the :latest digest changes — no manual
# rollout, no inbound port (poll, not webhook — NAT-friendly). Install Keel
# once on the cluster (deploy.sh does it).
# "Force update" button: grants the app a ServiceAccount that can patch (restart)
# its own Deployment, so the UI can re-pull the latest image on demand.
forceUpdate:
  enabled: true

keel:
  enabled: true
  # force = update on digest change of a mutable tag (latest).
  policy: force
  pollSchedule: "@every 1m"
  # approvals > 0 holds new images as a *pending approval* instead of deploying
  # them. The Adhan app surfaces it and approves it from its own UI (About
  # dialog). Set to 0 for fully automatic updates.
  approvals: 1
  # In-cluster Keel admin API the app proxies to approve updates.
  url: http://keel.keel.svc.cluster.local:9300

# The speaker half: Sonos/Freebox/Bluetooth discovery, and the scheduler that
# plays the adhan on them. Off, the app mounts no device or audio routes and
# starts no discovery — it serves prayer times and the mosque directory only.
#
# Leave it on here: this chart's default values describe the Raspberry Pi that
# drives the speakers. The internet-facing deployment uses values-public.yaml,
# where it is off — those routes control hardware and take no authentication,
# which was defensible only while the LAN was the boundary.
player:
  enabled: true

# hostNetwork is required for Sonos (SSDP) and Freebox (mDNS) LAN discovery.
# Pointless without the player, and costly: it binds :8000 on the node and
# forces the Recreate strategy (see deployment.yaml), so no zero-downtime roll.
hostNetwork: true
# When hostNetwork is on, keep cluster DNS working inside the pod.
dnsPolicy: ClusterFirstWithHostNet

timezone: Europe/Paris

# Pin the pod to the Pi that physically has the speakers/sound card, the
# Bluetooth adapter, and the node-local data hostPath below. Required on any
# multi-node cluster (otherwise the pod can schedule on a node without the
# audio hardware, off the speakers' LAN segment, or away from its data);
# harmless on a single-node cluster. Example:
#   nodeSelector: { kubernetes.io/hostname: raspberrypi }
nodeSelector: {}

# Persisted app data (prayer DB, Freebox token) on the node. Node-local
# hostPath: it only survives reschedules onto the SAME node, so set
# nodeSelector above to keep the pod (and its data) on one Pi.
dataPath: /home/pi/data

# Mount the host sound card so the "Cet appareil" device plays the adhan
# on the Pi itself (needs a privileged container). Disable if you only use
# Sonos / Freebox / Bluetooth.
audio:
  enabled: true
  devicePath: /dev/snd

# Bluetooth speakers: the container's bluetoothctl drives the HOST's bluetoothd
# over the system D-Bus. Requires a BT adapter + bluetoothd running on the Pi.
# Implies a privileged container (already set when audio is enabled).
bluetooth:
  enabled: false
  dbusPath: /var/run/dbus

# ClusterIP, not LoadBalancer: the pod runs with hostNetwork (reachable on the
# node IP at :8000) and is exposed on the LAN via the Traefik ingress
# (aladhan.home). A LoadBalancer here is redundant AND harmful — k3s servicelb
# (klipper) would claim hostPort 8000 and deadlock the hostNetwork pod.
service:
  type: ClusterIP
  port: 8000

# Off on the Pi: the LAN reaches it through the existing Traefik ingress for
# aladhan.home, declared outside this chart. The public deployment turns it on.
ingress:
  enabled: false
  className: traefik
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Values the deployment must not carry in git: AUTH_SECRET, DB_PASSWORD.
# Create the Secret out of band and name it here; every key in it is exported
# into the container. Empty means the app falls back to its own defaults, which
# is only ever right on the Pi.
envSecret: ""

# Extra plain environment variables, for the ones that are configuration rather
# than credentials (DB_TYPE, DB_HOST, APP_ENV…).
env: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi
