---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  {{- if .Values.service.dns.loadBalancerIP }}
  annotations:
    # MetalLB ignores the deprecated spec.loadBalancerIP field; the annotation is
    # the only thing that pins the address. Without it MetalLB auto-assigns from
    # the pool, collides with traefik and re-announces .44 — a LAN-wide DNS
    # outage on every reconcile.
    metallb.io/loadBalancerIPs: {{ .Values.service.dns.loadBalancerIP | quote }}
    metallb.io/address-pool: {{ .Values.service.dns.addressPool | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.dns.type }}
  {{- if .Values.service.dns.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.dns.externalTrafficPolicy }}
  {{- end }}
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  type: {{ .Values.service.web.type }}
  selector:
    app: pihole
  ports:
    - name: web
      port: {{ .Values.service.web.port }}
      targetPort: 80
      {{- if eq .Values.service.web.type "NodePort" }}
      nodePort: {{ .Values.service.web.nodePort }}
      {{- end }}
  {{- if .Values.service.web.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.web.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.service.web.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.web.loadBalancerIP }}
  {{- end }}